name: Prepare offline test runtime
on:
  push:
    paths: ['.github/workflows/offline-test-runtime.yml']
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Package the installed Microsoft PowerShell runtime for offline tests
        shell: bash
        run: |
          set -eu
          PS_HOME=$(pwsh -NoLogo -NoProfile -Command '$PSHOME')
          test -f "$PS_HOME/pwsh"
          tar -C "$PS_HOME" -czf "$RUNNER_TEMP/pwsh-runtime.tar.gz" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: offline-pwsh-runtime
          path: ${{ runner.temp }}/pwsh-runtime.tar.gz
          retention-days: 1
          compression-level: 0
